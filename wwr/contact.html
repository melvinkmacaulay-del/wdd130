<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with White Water Rafting. Contact us for reservations, inquiries, or questions about our thrilling river adventures in Kolob, California.">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="images/rafting-logo.png.jpeg" alt="White Water Rafting Logo">
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html" class="active">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="contact-hero">
            <h1>Contact Us</h1>
        </div>

        <div class="contact-container">
            <!-- Company Info -->
            <div class="company-info">
                <h2>White Water Rafting Company</h2>
                <p>123 Main River Street<br>
                   Kolob, California 84741<br>
                   <strong>Phone:</strong> +1 (999) 999-9999<br>
                   <strong>Email:</strong> info@whitewater.com</p>
                
                <div class="map">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3168.123456789!2d-112.345678!3d37.123456!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDA3JzI0LjAiTiAxMTLCsDIwJzQ1LjAiVw!5e0!3m2!1sen!2sus!4v1234567890" 
                            width="100%" height="300" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>

            <!-- Contact Form -->
            <div class="contact-form">
                <form action="#" method="post">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                    
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                    
                    <fieldset>
                        <legend>Message Purpose</legend>
                        <label>
                            <input type="radio" name="purpose" value="general" checked> General Inquiry
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="reservation"> Reservation Question
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="suggestion"> Website Suggestion
                        </label>
                    </fieldset>
                    
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                    
                    <label>
                        <input type="checkbox" name="newsletter"> Please subscribe me to the monthly newsletter
                    </label>
                    
                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </div>

        <!-- Team Section -->
        <section class="team">
            <h2>We Are Here to Serve You</h2>
            <div class="team-grid">
                <figure class="employee">
                    <img src="images/employee1.jpg" alt="Jane Doe - Lead Guide">
                    <figcaption>Jane Doe - Lead Guide</figcaption>
                </figure>
                <figure class="employee">
                    <img src="images/employee2.jpg" alt="John Smith - Safety Director">
                    <figcaption>John Smith - Safety Director</figcaption>
                </figure>
                <figure class="employee">
                    <img src="images/employee3.jpg" alt="Sarah Johnson - Trip Coordinator">
                    <figcaption>Sarah Johnson - Trip Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting</p>
        <nav class="socialmedia">
            <!--facebook.png.jpeg, twitter.png.jpeg, instagram.png.jpeg-->
        </nav>
    </footer>
</body>
</html>
